# Render blueprint, mirroring the live "telugupanchangam" web service.
#
# DATABASE_URL points at Neon (external), so no database block here.
services:
  - type: web
    name: telugupanchangam
    runtime: node
    plan: starter # $7/mo; "free" spins down after inactivity, which stops the
                  # in-process notification scheduler (server/push-service.ts).
    region: ohio # same AWS region (us-east-2) as the Neon database
    # --include=dev is required: Render sets NODE_ENV=production, which makes
    # npm skip devDependencies, and vite/esbuild/tsx all live there.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/panchang/today
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # sync:false = set by hand in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Changing the VAPID pair silently invalidates every existing push
      # subscription, so treat these as permanent once devices have subscribed.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:panchangam@mytelugupanchangam.space
      # Secret key that unlocks GET /api/stats (usage numbers). Any long
      # random string; endpoint is disabled while unset.
      - key: STATS_KEY
        sync: false
      # Sentry error tracking (both optional; features no-op while unset).
      # SENTRY_DSN = server project DSN, VITE_SENTRY_DSN = browser project DSN
      # (baked into the client bundle at build time).
      - key: SENTRY_DSN
        sync: false
      - key: VITE_SENTRY_DSN
        sync: false
